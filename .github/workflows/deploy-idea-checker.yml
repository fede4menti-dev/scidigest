name: Deploy idea checker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-idea-checker.yml"]
  workflow_dispatch:   # "Run workflow" button

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Check Cloudflare secrets are set
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::Skipping deploy: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see IDEA-CHECKER-SETUP.md), then run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show which Cloudflare account and permissions the token has
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami || echo "::warning::The token couldn't be verified. Check CLOUDFLARE_API_TOKEN."
          echo "Account ID secret has ${#CLOUDFLARE_ACCOUNT_ID} characters (a Cloudflare account ID has 32)."

      - name: Create the account storage (first deploy only) and connect it
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() {
            npx wrangler kv namespace list 2>/tmp/kv-list-errors.txt | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const i = s.indexOf("["); if (i < 0) return;
                const list = JSON.parse(s.slice(i));
                const ns = list.find(n => n.title === "scidigest-data" || n.title.endsWith("-scidigest-data"));
                if (ns) process.stdout.write(ns.id);
              });'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx wrangler kv namespace create scidigest-data || true
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then
            echo "::warning::Couldn't create the account storage (Workers KV). The idea checker will still deploy, but accounts stay off. Give the API token the permission 'Account > Workers KV Storage > Edit' and run this workflow again."
            exit 1
          fi
          printf '\n[[kv_namespaces]]\nbinding = "DATA"\nid = "%s"\n' "$id" >> wrangler.toml
          echo "Account storage: $id"

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Idea checks per day for the whole site (repository variable IDEA_CHECKS_PER_DAY, default 150).
          DAILY_LIMIT: ${{ vars.IDEA_CHECKS_PER_DAY || '150' }}
          # Optional cost controls (repository variables): require sign-in for full AI reports,
          # a daily allowance per account, and the model used for Idea Check.
          REQUIRE_ACCOUNT: ${{ vars.REQUIRE_ACCOUNT_FOR_CHECKS || '0' }}
          PER_ACCOUNT: ${{ vars.CHECKS_PER_ACCOUNT_PER_DAY || '5' }}
          CHECK_MODEL: ${{ vars.IDEA_CHECK_MODEL || 'claude-opus-5-5' }}
        run: >-
          npx wrangler deploy
          --var "DAILY_CHECK_LIMIT:$DAILY_LIMIT"
          --var "REQUIRE_ACCOUNT_FOR_CHECKS:$REQUIRE_ACCOUNT"
          --var "CHECKS_PER_ACCOUNT_PER_DAY:$PER_ACCOUNT"
          --var "IDEA_CHECK_MODEL:$CHECK_MODEL"

      - name: Upload secrets to the worker (only those that are set)
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          APP_TOKEN: ${{ secrets.IDEA_CHECKER_APP_TOKEN }}
        run: |
          for name in ANTHROPIC_API_KEY OPENALEX_API_KEY APP_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "($name not set, skipping)"
            fi
          done
          echo "Idea checker URL: https://scidigest-idea-checker.<your-workers-subdomain>.workers.dev (shown in the deploy step above)"
