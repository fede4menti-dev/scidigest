name: Deploy idea checker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-idea-checker.yml"]
  workflow_dispatch:   # "Run workflow" button

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Check Cloudflare secrets are set
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::notice::Skipping deploy: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see IDEA-CHECKER-SETUP.md), then run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the account storage (first deploy only) and connect it
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() {
            npx wrangler kv namespace list 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const i = s.indexOf("["); if (i < 0) return;
                const list = JSON.parse(s.slice(i));
                const ns = list.find(n => n.title === "scidigest-data" || n.title.endsWith("-scidigest-data"));
                if (ns) process.stdout.write(ns.id);
              });'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx wrangler kv namespace create scidigest-data
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then echo "::error::Couldn't create the KV namespace"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "DATA"\nid = "%s"\n' "$id" >> wrangler.toml
          echo "Account storage: $id"

      - name: Deploy to Cloudflare Workers
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Idea checks per day for the whole site (repository variable IDEA_CHECKS_PER_DAY, default 150).
          DAILY_LIMIT: ${{ vars.IDEA_CHECKS_PER_DAY || '150' }}
        run: npx wrangler deploy --var "DAILY_CHECK_LIMIT:$DAILY_LIMIT"

      - name: Upload secrets to the worker (only those that are set)
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          APP_TOKEN: ${{ secrets.IDEA_CHECKER_APP_TOKEN }}
        run: |
          for name in ANTHROPIC_API_KEY OPENALEX_API_KEY APP_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "($name not set, skipping)"
            fi
          done
          echo "Idea checker URL: https://scidigest-idea-checker.<your-workers-subdomain>.workers.dev (shown in the deploy step above)"
