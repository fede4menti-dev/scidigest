name: Daily digest

on:
  schedule:
    - cron: "17 10 * * *"   # every day at 10:17 UTC; change to suit your time zone
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build today's digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCIDIGEST_EMAIL: ${{ secrets.SCIDIGEST_EMAIL }}
          # Extra papers per topic for readers who follow topics. Main cost lever:
          # set a repository variable SCIDIGEST_PER_TOPIC (Settings > Secrets and variables > Actions > Variables).
          SCIDIGEST_PER_TOPIC: ${{ vars.SCIDIGEST_PER_TOPIC || '2' }}
        run: python -m scidigest --top 8 --out reports --site docs

      - name: Publish to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Digest for $(date -u +%F)"
          git push
